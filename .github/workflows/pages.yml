name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Ayni anda tek yayin; devam eden yayin iptal edilmez
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # "npx next build" DEGIL: npm'in prebuild kancasi yalnizca "npm run build"
      # ile calisir ve gate-key.ts'yi uretir. npx ile build gate-key.ts bulamaz.
      - name: Statik export uret
        run: npm run build
        env:
          # basePath'i /ortak-site olarak acar (next.config.ts)
          GITHUB_PAGES: "true"
          # Tanimli degilse scripts/gate-key.mjs fallback sifreye duser,
          # build kirilmaz.
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
